<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>艾尔之光 · 在线启动器</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <div id="bg-layer" aria-hidden="true"><canvas id="bg-canvas" hidden></canvas><img id="bg-image" alt="" hidden><video id="bg-video" autoplay loop muted playsinline hidden></video><div id="bg-dim"></div></div>
  <div class="app-shell">
    <aside class="rail">
      <a class="rail-brand" href="#home" aria-label="艾尔之光首页"><img src="/favicon.svg" alt=""></a>
      <nav id="navigation" aria-label="主导航"></nav>
      <div class="rail-bottom"><button class="rail-item" data-nav="settings" title="背景与外观" aria-label="背景与外观" id="rail-appearance"></button></div>
    </aside>
    <div class="workspace">
      <header class="topbar" id="titlebar">
        <div class="titlebar-left pywebview-drag-region">
          <span class="app-title">艾尔之光 启动器</span><span class="app-version">v2.0</span>
          <span class="chip" id="header-status"><i class="chip-dot"></i>正在连接</span>
          <button class="chip chip-click" id="gm-pill" data-nav="gm" title="查看 GM 工具"><i class="chip-dot"></i>GM 通道 空闲</button>
        </div>
        <div class="top-actions">
          <button class="pill-button" data-action="check">环境体检</button>
          <button class="pill-button" data-nav="settings">外观</button>
          <div class="window-controls">
            <button class="icon-button window-button" id="minimize-app" title="最小化" aria-label="最小化窗口" hidden></button>
            <button class="icon-button window-button" id="maximize-app" title="最大化" aria-label="最大化窗口" hidden></button>
            <button class="icon-button window-button close-button" id="close-app" title="关闭启动器" aria-label="关闭启动器"></button>
          </div>
        </div>
      </header>
      <main id="main" tabindex="-1" aria-busy="true"><div class="initial-loading"><div class="spinner"></div><p>正在读取你的本地世界…</p></div></main>
      <div class="dock">
        <div class="dock-message" id="dock-message">连接本地环境…</div>
        <div class="dock-right">
          <button class="dock-character" id="dock-character" data-nav="gm" title="当前角色 · 查看 GM 工具" hidden></button>
          <button class="dock-launch" id="dock-launch" data-action="start"></button>
        </div>
      </div>
      <footer class="footer-strip"><span id="path-left" class="footer-path">存档：—</span><span id="path-right" class="footer-path">日志：—</span></footer>
    </div>
  </div>
  <div id="toast-area" aria-live="polite" aria-atomic="true"></div>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title"><form method="dialog"><div class="dialog-icon" id="dialog-icon"></div><p class="eyebrow">确认本次操作</p><h2 id="dialog-title"></h2><div id="dialog-body"></div><div class="dialog-actions"><button class="button subtle" value="cancel">返回修改</button><button class="button primary" id="dialog-confirm" value="confirm">确认并保存</button></div></form></dialog>
</body>
</html>
