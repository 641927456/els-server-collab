name: collaboration-checks
on:
  push:
    branches: [main, 'fix/**', 'feature/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-check:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-server.txt
      - run: python -B tools/ci_checks.py
      - run: python -B -m unittest discover -s tests -p test_account_key_bindings.py
      - run: python -B -m unittest discover -s tests -p test_launcher_v37_v38_archive.py
  runtime-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: gh release download collab-runtime-v2 --repo "${{ github.repository }}" --pattern ELS-Server-With-Local-Launcher-20261019-v2.zip --dir .asset-cache
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python -B tools/bootstrap_runtime.py --archive .asset-cache/ELS-Server-With-Local-Launcher-20261019-v2.zip
      - run: .\python\python.exe -B tools/ci_checks.py --with-runtime
