<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>艾尔之光 · 本地启动器</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="艾尔之光首页"><img src="/favicon.svg" alt=""><span><strong>艾尔之光</strong><small>ELRIOS LOCAL</small></span></a>
      <div class="nav-label">冒险空间</div>
      <nav id="navigation" aria-label="主导航"></nav>
      <div class="sidebar-bottom"><div class="local-tag"><i></i><span>你的本地世界<small>进度保存在这台电脑</small></span></div><div class="edition">LOCAL EDITION <span>01</span></div></div>
    </aside>
    <div class="workspace">
      <header class="topbar" id="titlebar"><div class="breadcrumb pywebview-drag-region"><span>ELRIOS</span><b>/</b><span id="breadcrumb">冒险首页</span></div><div class="top-actions"><span class="state-pill" id="header-status">正在连接</span><button class="icon-button" id="refresh" title="刷新当前页面" aria-label="刷新当前页面"></button><div class="window-controls"><button class="icon-button window-button" id="minimize-app" title="最小化" aria-label="最小化窗口" hidden></button><button class="icon-button window-button" id="maximize-app" title="最大化" aria-label="最大化窗口" hidden></button><button class="icon-button window-button close-button" id="close-app" title="关闭启动器" aria-label="关闭启动器"></button></div></div></header>
      <main id="main" tabindex="-1" aria-busy="true"><div class="initial-loading"><div class="spinner"></div><p>正在读取你的本地世界…</p></div></main>
      <footer class="app-footer"><span><i class="status-dot"></i><span id="footer-state">连接本地环境</span></span><span>本地单人环境 <b>·</b> DX11</span></footer>
    </div>
  </div>
  <div id="toast-area" aria-live="polite" aria-atomic="true"></div>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title"><form method="dialog"><div class="dialog-icon" id="dialog-icon"></div><p class="eyebrow">确认本次操作</p><h2 id="dialog-title"></h2><div id="dialog-body"></div><div class="dialog-actions"><button class="button subtle" value="cancel">返回修改</button><button class="button primary" id="dialog-confirm" value="confirm">确认并保存</button></div></form></dialog>
</body>
</html>
